{% extends "base.html" %}

{% block content %}
  {% if page and page.markdown %}
  <div class="ai-export-bar" style="display: flex; justify-content: flex-end; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem; padding: 0.6rem 0.85rem; background: var(--md-code-bg-color); border: 1px solid var(--md-default-fg-color--lightest); border-radius: 6px;">
    <span style="font-size: 0.82rem; opacity: 0.85; font-weight: 500; margin-right: auto; display: inline-flex; align-items: center; gap: 0.4rem;">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>
      <strong>AI Agent Context</strong>
    </span>
    <button id="copy-markdown-btn" class="md-button md-button--primary" style="cursor: pointer; font-size: 0.78rem; border-radius: 4px; padding: 0.35rem 0.75rem; display: inline-flex; align-items: center; gap: 0.4rem;" title="Copy this page's raw markdown to your clipboard for your AI coding assistant">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
      <span id="copy-btn-text">Copy Page as Markdown for AI</span>
    </button>
    <button id="download-markdown-btn" class="md-button" style="cursor: pointer; font-size: 0.78rem; border-radius: 4px; padding: 0.35rem 0.75rem; display: inline-flex; align-items: center; gap: 0.4rem;" title="Download this page as a .md file">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>Export .md</span>
    </button>
  </div>

  <textarea id="__raw_page_markdown__" style="display: none;" readonly>{{ page.markdown | e }}</textarea>
  {% endif %}

  {{ super() }}
{% endblock %}
