site_name: pydantic-stream-file
site_description: High-performance O(1) RAM streaming file validation glue layer for Pydantic
site_author: Bartosz Golebiowski
repo_url: https://github.com/bartoszgolebiowski/pydantic-stream-file
repo_name: bartoszgolebiowski/pydantic-stream-file
edit_uri: blob/main/docs/

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate
    - content.action.view
    - content.action.edit

extra_javascript:
  - javascripts/export-markdown.js

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - tables
  - def_list

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Source Adapters:
      - CSV & Flat Files: adapters/csv.md
      - Constant-Memory XML: adapters/xml.md
  - Validation Engine:
      - Policies & Batching: validation/engine.md
      - Async Streaming: validation/async.md
  - Advanced Topics:
      - Polymorphic Event Routing: advanced/polymorphic.md
      - Architecture & Benchmarks: advanced/architecture.md
  - API Reference: api-reference.md
  - For AI Coding Agents: agent-guide.md
